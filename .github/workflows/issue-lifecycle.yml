name: Issue lifecycle on PR close

# Closes the terminal-transition gap in the squad's label lifecycle
# (see issue #94): Chisel applies `needs-review` at creation, Cody
# swaps `in-progress` -> `in-review` when a PR opens, but nothing ever
# moved an issue out of `in-review` or closed it once its PR merged.
#
# This workflow is the terminal step: it runs whenever a PR targeting
# the default branch is closed (merged or not) and reconciles the
# linked issue's state. It also runs when an issue is reopened, to
# restore the state label(s) a non-merge PR close stripped (see #106
# defect d).
#
# ---------------------------------------------------------------------
# IMPORTANT COUPLING: the label names below (`in-progress`, `in-review`,
# `needs-review`) are hardcoded to the squad's documented defaults.
# They are NOT read from `chisel-config.json`, because that file lives
# in the user's second-brain vault (~/second-brain/projects/<name>/.squad/),
# which is outside this repo and not available to a GitHub Actions
# runner. If a user customises `state_labels` / `review_label` in their
# vault config, this workflow will silently stop matching those custom
# names. There is no config-syncing mechanism here by design (see #94)
# -- if you rename labels, update the `STATE_LABELS` list below too.
# ---------------------------------------------------------------------
#
# IMPORTANT PERMISSIONS PREREQUISITE: this workflow requests
# `issues: write` via the `permissions:` block below, but the repo-level
# "Workflow permissions" setting (Settings -> Actions -> General) can
# still override and block it if set to "Read repository contents
# permission" (read-only). If the first run fails with a 403 on label
# removal or issue close, switch that setting to "Read and write
# permissions". This workflow does not attempt to change it itself.
#
# IMPORTANT FORK PREREQUISITE (see #106 defect c): when the merged PR
# came from a fork, GITHUB_TOKEN is forced read-only regardless of the
# repo/workflow permissions settings above. Label and close calls in
# that case return 403. Those failures are caught and logged rather
# than failing the run -- see `withPermissionGuard` below.

on:
  pull_request:
    types: [closed]
    branches: [main]
  issues:
    types: [reopened]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  reconcile-issue:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve issue and reconcile labels/state
        uses: actions/github-script@v7
        with:
          script: |
            // Labels this workflow owns exclusively. Never touch anything
            // else (bug, documentation, enhancement, etc.) -- see #94
            // constraint 5.
            const STATE_LABELS = ['in-progress', 'in-review', 'needs-review'];

            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Runs an issues.* write call, swallowing failures caused by
            // insufficient token permissions (403, or 401) instead of
            // rethrowing and failing the whole run. This is what lets a
            // merged fork PR -- which only gets a read-only token -- log
            // a warning and move on rather than turn the run red.
            // See #106 defect (c).
            async function withPermissionGuard(description, fn) {
              try {
                await fn();
              } catch (err) {
                if (err.status === 403 || err.status === 401) {
                  console.log(`Permission denied while ${description} (status ${err.status}). This is expected for merged fork PRs, which receive a read-only token. Logging and continuing.`);
                  return;
                }
                throw err;
              }
            }

            // --- Step 1: resolve the issue this PR is for. ---------------
            // Priority order (see #94 constraint 3):
            //   a) GitHub's own closingIssuesReferences (e.g. "Closes #N"
            //      in the PR body) -- most reliable when present, but only
            //      when the reference resolves to THIS repository. A PR
            //      body can say "Closes owner/other#5", which GitHub still
            //      surfaces here; blindly using `number` would act on an
            //      unrelated same-numbered issue in this repo. See #106
            //      defect (b).
            //   b) The squad's branch-name convention: <issue-number>-<slug>
            //      (e.g. "57-forge-question-dependency-protocol").
            //   c) The PR title convention: "[#N] <type>: <subject>".
            // If none resolves, exit without acting -- never guess.

            let issueNumbers = [];

            const gqlResult = await github.graphql(
              `query($owner:String!, $repo:String!, $number:Int!) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$number) {
                    closingIssuesReferences(first: 10) {
                      nodes {
                        number
                        repository { owner { login } name }
                      }
                    }
                  }
                }
              }`,
              { owner, repo, number: pr.number }
            );
            const linked = gqlResult.repository.pullRequest.closingIssuesReferences.nodes;
            const localLinked = linked.filter(
              (n) => n.repository.owner.login === owner && n.repository.name === repo
            );
            const crossRepoLinked = linked.filter((n) => !localLinked.includes(n));
            if (crossRepoLinked.length > 0) {
              console.log(`Ignoring ${crossRepoLinked.length} closing reference(s) that point to a different repository: ${crossRepoLinked.map((n) => `${n.repository.owner.login}/${n.repository.name}#${n.number}`).join(', ')}`);
            }
            if (localLinked.length > 0) {
              issueNumbers = localLinked.map((n) => n.number);
            }

            if (issueNumbers.length === 0) {
              const branchMatch = /^(\d+)-/.exec(pr.head.ref || '');
              if (branchMatch) {
                issueNumbers = [parseInt(branchMatch[1], 10)];
              }
            }

            if (issueNumbers.length === 0) {
              const titleMatch = /^\[#(\d+)\]/.exec(pr.title || '');
              if (titleMatch) {
                issueNumbers = [parseInt(titleMatch[1], 10)];
              }
            }

            if (issueNumbers.length === 0) {
              console.log(`No issue could be resolved for PR #${pr.number}. Exiting without action.`);
              return;
            }

            console.log(`Resolved issue(s) for PR #${pr.number}: ${issueNumbers.join(', ')}`);

            // --- Step 2: reconcile each resolved issue. -------------------
            for (const issueNumber of issueNumbers) {
              // `github.graphql` throws (rather than resolving with a null
              // `issue` field) when the number does not exist in this
              // repository at all -- e.g. a branch named `9999-experiment`
              // that was never a real issue. Without this try/catch the
              // throw propagates out of the loop and fails the whole run
              // red instead of skipping. See #106 defect (a).
              let issueData;
              try {
                issueData = await github.graphql(
                  `query($owner:String!, $repo:String!, $number:Int!) {
                    repository(owner:$owner, name:$repo) {
                      issue(number:$number) {
                        state
                        subIssuesSummary { total }
                      }
                    }
                  }`,
                  { owner, repo, number: issueNumber }
                );
              } catch (err) {
                console.log(`Issue #${issueNumber} could not be resolved (${err.message}). Skipping.`);
                continue;
              }

              const issue = issueData.repository.issue;
              if (!issue) {
                console.log(`Issue #${issueNumber} not found. Skipping.`);
                continue;
              }

              // Never auto-close a container issue (has sub-issues), but
              // still clear its state labels on merge -- only the
              // auto-close is meant to be skipped for containers, not the
              // label cleanup. See #106 defect (e).
              const isContainer = issue.subIssuesSummary && issue.subIssuesSummary.total > 0;

              if (pr.merged) {
                // Clear all three state labels. `needs-review` is cleared
                // here too (not left permanent): since it is applied
                // uniformly at creation and never distinguished anything
                // (see #94 defect 2), the decision comment on #94 treats
                // it as noise to clear alongside the others once the
                // issue is done.
                await withPermissionGuard(`removing state labels from issue #${issueNumber}`, () =>
                  removeLabels(issueNumber, STATE_LABELS)
                );

                if (isContainer) {
                  console.log(`Issue #${issueNumber} has sub-issues (container). State labels cleared; skipping auto-close.`);
                  continue;
                }

                if (issue.state !== 'CLOSED') {
                  await withPermissionGuard(`closing issue #${issueNumber}`, () =>
                    github.rest.issues.update({
                      owner,
                      repo,
                      issue_number: issueNumber,
                      state: 'closed',
                      state_reason: 'completed',
                    })
                  );
                  console.log(`Closed issue #${issueNumber} (PR #${pr.number} merged).`);
                } else {
                  console.log(`Issue #${issueNumber} already closed. Idempotent no-op.`);
                }
              } else {
                // PR closed WITHOUT merging. Do not mark the issue done,
                // but don't leave it stranded in `in-review` either --
                // clear just that label so the issue returns to an
                // actionable state (it may still be legitimately
                // `in-progress` if work continues, so that label is left
                // alone).
                await withPermissionGuard(`clearing in-review on issue #${issueNumber}`, () =>
                  removeLabels(issueNumber, ['in-review'])
                );
                console.log(`PR #${pr.number} closed without merging. Cleared in-review on issue #${issueNumber}, left open.`);
              }
            }

            async function removeLabels(issueNumber, labels) {
              for (const name of labels) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    name,
                  });
                } catch (err) {
                  // 404 means the label was never set (or already removed)
                  // -- idempotent no-op, not an error. See #94 constraint 5.
                  // Permission errors (403/401) are handled by the caller's
                  // withPermissionGuard, so they are allowed to propagate
                  // up out of this function.
                  if (err.status !== 404) {
                    throw err;
                  }
                }
              }
            }

  restore-labels-on-reopen:
    if: github.event_name == 'issues' && github.event.action == 'reopened'
    runs-on: ubuntu-latest
    steps:
      - name: Restore state label stripped by a non-merge PR close
        uses: actions/github-script@v7
        with:
          script: |
            // A PR closed without merging clears `in-review` from its
            // linked issue (see the `reconcile-issue` job above). If that
            // issue is later reopened, nothing ever put `in-review` back
            // -- reopening was a dead end for that label. Restore it here.
            // See #106 defect (d).
            //
            // This is deliberately narrow: it restores `in-review`
            // specifically, since that is the label the non-merge-close
            // path strips. It does not attempt to guess whether
            // `in-progress` should also be restored, since that label is
            // never removed by the close path and reopening should not
            // invent state this workflow never took away.
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.payload.issue.number;

            try {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: ['in-review'],
              });
              console.log(`Restored in-review on issue #${issueNumber} after reopen.`);
            } catch (err) {
              if (err.status === 403 || err.status === 401) {
                console.log(`Permission denied while restoring in-review on issue #${issueNumber} (status ${err.status}). Logging and continuing.`);
                return;
              }
              throw err;
            }
