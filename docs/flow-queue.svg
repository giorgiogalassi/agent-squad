<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Agent Squad: one batch through the pipeline</title>
<desc id="dsc">Two stacked issues move from Chisel through the review gate, Ralph, Cody (tests first), Reven and merge, with the child PR retargeted to main before the parent merges, ending at lore-checkpoint.</desc>
